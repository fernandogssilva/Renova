             C 62 74, 98 74, 98 82
             C 100 94, 102 100, 102 108
             C 102 117, 91 121, 80 121
             C 69 121, 58 117, 58 108
             C 58 100, 60 94, 62 82 Z"/>
    <!-- dedos, abaixo da planta -->
    <circle cx="59"  cy="133" r="6.4"/>
    <circle cx="70"  cy="137" r="5.6"/>
    <circle cx="80"  cy="138" r="5.2"/>
    <circle cx="90"  cy="137" r="4.8"/>
    <circle cx="100" cy="133" r="4.2"/>
  </g>
</svg>
