<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" font-family="Segoe UI, Inter, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="55%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#FB923C"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="860" fill="#0A1410"/>

  <!-- ===== Cabeçalho ===== -->
  <g transform="translate(40,34)">
    <g transform="scale(0.42)">
      <path d="M 80 6 L 150 30 L 145 96 Q 140 128 80 154 Q 20 128 15 96 L 10 30 Z" fill="url(#brand)"/>
      <g fill="#0A1410" opacity="0.92">
        <ellipse cx="80" cy="46" rx="16" ry="19"/>
        <path d="M 62 82 C 62 74, 98 74, 98 82 C 100 94, 102 100, 102 108
                 C 102 117, 91 121, 80 121 C 69 121, 58 117, 58 108
                 C 58 100, 60 94, 62 82 Z"/>
        <circle cx="59" cy="133" r="6.4"/><circle cx="70" cy="137" r="5.6"/>
        <circle cx="80" cy="138" r="5.2"/><circle cx="90" cy="137" r="4.8"/>
        <circle cx="100" cy="133" r="4.2"/>
      </g>
    </g>
    <text x="88" y="36" font-size="34" font-weight="800" fill="url(#wordmark)" letter-spacing="-0.5">CURUPIRA</text>
    <text x="90" y="58" font-size="13" fill="#8FB5A2" letter-spacing="2.6">QUEM INVADE, SE PERDE</text>
  </g>

  <text x="1200" y="58" font-size="13" fill="#5F8271" text-anchor="end">Mapa de funções · v2.2</text>
  <line x1="40" y1="108" x2="1200" y2="108" stroke="#1B2E25" stroke-width="1"/>

  <!-- ===== SEGURANÇA ===== -->
  <g transform="translate(40,140)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#EF4444"/>
    <text x="16" y="19" font-size="14" font-weight="700" fill="#EF4444" letter-spacing="1.6">SEGURANÇA</text>

    <g transform="translate(0,40)">
      <rect x="0" y="0" width="373" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Vulnerabilidades</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">CVEs da Microsoft (MSRC) dos últimos meses,</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">cruzadas com os patches já instalados.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">Correção em lote · severidade · CVSS</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">Aplica KB direto ou indica o comando</text>
    </g>

    <g transform="translate(393,40)">
      <rect x="0" y="0" width="373" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Auditoria local de segurança</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">12 verificações nativas de configuração</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">insegura do próprio Windows.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">Defender · Firewall · BitLocker · LSA</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">SMBv1 · RDP/NLA · Secure Boot · TPM</text>
    </g>

    <g transform="translate(786,40)">
      <rect x="0" y="0" width="374" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Windows Update + Catálogo</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">Instala atualizações sem prompt e compara</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">sua build com o release-health oficial.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">Detecta quando o Update atrasa a entrega</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">Link direto para o Update Catalog</text>
    </g>
  </g>

  <!-- ===== LIMPEZA ===== -->
  <g transform="translate(40,330)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#34D399"/>
    <text x="16" y="19" font-size="14" font-weight="700" fill="#34D399" letter-spacing="1.6">LIMPEZA</text>

    <g transform="translate(0,40)">
      <rect x="0" y="0" width="373" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Limpeza de disco</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">Temporários, caches de navegador e de</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">ferramentas de desenvolvimento.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">npm · pip · NuGet · Go · Windows Update</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">Ignora junctions (proteção anti-symlink)</text>
    </g>

    <g transform="translate(393,40)">
      <rect x="0" y="0" width="373" height="118" rx="10" fill="#111F19" stroke="#FB923C" stroke-width="1.5"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Regras da comunidade</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">Base winapp2.ini com milhares de regras</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">mantidas há 15+ anos pela comunidade.</text>
      <text x="18" y="90" font-size="11.5" fill="#FB923C">Detecta só o que está instalado aqui</text>
      <text x="18" y="106" font-size="11.5" fill="#FB923C">Formato que o CCleaner 7 abandonou</text>
    </g>

    <g transform="translate(786,40)">
      <rect x="0" y="0" width="374" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Registro do Windows</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">7 categorias de entradas órfãs, com backup</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">.reg obrigatório antes de qualquer remoção.</text>
      <text x="18" y="90" font-size="11.5" fill="#FBBF24">Não varre CLSID, fontes nem Shared DLLs</text>
      <text x="18" y="106" font-size="11.5" fill="#FBBF24">Detecta regra de firewall órfã (segurança)</text>
    </g>
  </g>

  <!-- ===== DESEMPENHO ===== -->
  <g transform="translate(40,520)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#FB923C"/>
    <text x="16" y="19" font-size="14" font-weight="700" fill="#FB923C" letter-spacing="1.6">DESEMPENHO</text>

    <g transform="translate(0,40)">
      <rect x="0" y="0" width="373" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Memória RAM</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">Compacta working sets e descarta a</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">standby list, devolvendo RAM ao sistema.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">Lista de apps por consumo</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">Compactar sem fechar · ou encerrar</text>
    </g>

    <g transform="translate(393,40)">
      <rect x="0" y="0" width="373" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Discos</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">Análise de fragmentação por unidade e</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">otimização adequada ao tipo de mídia.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">HDD recebe desfragmentação</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">SSD recebe TRIM, não desfrag</text>
    </g>

    <g transform="translate(786,40)">
      <rect x="0" y="0" width="374" height="118" rx="10" fill="#111F19" stroke="#2A4437"/>
      <text x="18" y="28" font-size="15" font-weight="700" fill="#F0FDF4">Inicialização</text>
      <text x="18" y="50" font-size="12" fill="#8FB5A2">Programas que sobem com o Windows,</text>
      <text x="18" y="67" font-size="12" fill="#8FB5A2">lidos direto do registro.</text>
      <text x="18" y="90" font-size="11.5" fill="#34D399">HKCU e HKLM · Run e RunOnce</text>
      <text x="18" y="106" font-size="11.5" fill="#34D399">Alternar sem abrir o regedit</text>
    </g>
  </g>

  <!-- ===== TRANSPARÊNCIA ===== -->
  <g transform="translate(40,710)">
    <rect x="0" y="0" width="4" height="26" rx="2" fill="#8FB5A2"/>
    <text x="16" y="19" font-size="14" font-weight="700" fill="#8FB5A2" letter-spacing="1.6">TRANSPARÊNCIA</text>

    <g transform="translate(0,38)">
      <rect x="0" y="0" width="1160" height="76" rx="10" fill="#111F19" stroke="#2A4437"/>

      <text x="20" y="27" font-size="13" font-weight="700" fill="#F0FDF4">Varredura ao vivo</text>
      <text x="20" y="47" font-size="11.5" fill="#8FB5A2">Cada módulo mostra o que está</text>
      <text x="20" y="63" font-size="11.5" fill="#8FB5A2">analisando e o que encontrou.</text>

      <line x1="300" y1="16" x2="300" y2="60" stroke="#2A4437"/>

      <text x="320" y="27" font-size="13" font-weight="700" fill="#F0FDF4">Logs completos</text>
      <text x="320" y="47" font-size="11.5" fill="#8FB5A2">Em tela e em arquivo, com rotação</text>
      <text x="320" y="63" font-size="11.5" fill="#8FB5A2">diária e 14 dias de retenção.</text>

      <line x1="600" y1="16" x2="600" y2="60" stroke="#2A4437"/>

      <text x="620" y="27" font-size="13" font-weight="700" fill="#F0FDF4">Sem telemetria</text>
      <text x="620" y="47" font-size="11.5" fill="#8FB5A2">Nenhum dado sai da máquina. As únicas</text>
      <text x="620" y="63" font-size="11.5" fill="#8FB5A2">chamadas são a fontes públicas da Microsoft.</text>

      <line x1="920" y1="16" x2="920" y2="60" stroke="#2A4437"/>

      <text x="940" y="27" font-size="13" font-weight="700" fill="#F0FDF4">Código aberto</text>
      <text x="940" y="47" font-size="11.5" fill="#8FB5A2">Hashes SHA-256 publicados</text>
      <text x="940" y="63" font-size="11.5" fill="#8FB5A2">em cada release.</text>
    </g>
  </g>
</svg>
